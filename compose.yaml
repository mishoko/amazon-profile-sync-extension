# docker compose up -d --build
#   server: the local Waybill server, published on 127.0.0.1:4417 only
#   db:     Postgres for profiles and accounts; also published on
#           127.0.0.1:5433 (loopback only) for inspecting it with psql
#           (WAYBILL_DB_PORT changes it, e.g. for a second, test stack)
# POSTGRES_PASSWORD must be set, e.g. in .env (see .env.example).
# The extension always connects to 4417. WAYBILL_PORT and WAYBILL_EXTENSION_IDS
# exist only to run an isolated test stack (another project name and port)
# next to it; the server checks the Host header, so both ports stay equal.
services:
  server:
    build: { context: ., target: runtime }
    environment:
      WAYBILL_PORT: ${WAYBILL_PORT:-4417}
      WAYBILL_EXTENSION_IDS: ${WAYBILL_EXTENSION_IDS:-dmhkjckieepnigmelmogkmomgmkgkkdn}
      DATABASE_URL: postgres://waybill:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/waybill
    ports:
      - "127.0.0.1:${WAYBILL_PORT:-4417}:${WAYBILL_PORT:-4417}"
    depends_on:
      db: { condition: service_healthy }
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped

  db:
    image: postgres:17-alpine
    ports:
      - "127.0.0.1:${WAYBILL_DB_PORT:-5433}:5432"
    environment:
      POSTGRES_USER: waybill
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: waybill
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U waybill -d waybill"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  # Server and store tests against this project's database (it is wiped).
  # Use a separate project and DB port, so the main stack is untouched:
  #   WAYBILL_DB_PORT=5499 docker compose -p waybill-test --profile test run --rm tests
  tests:
    profiles: [test]
    build: { context: ., target: test }
    environment:
      DATABASE_URL: postgres://waybill:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/waybill
    depends_on:
      db: { condition: service_healthy }

volumes:
  db-data:
